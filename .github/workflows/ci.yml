name: CI - Bank Fraud Classification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx shap lightgbm polars

    - name: Run Schema and Metric Consistency Tests
      run: |
        pytest tests/test_metric_consistency.py tests/test_training_inference_schema.py -v

    - name: Run Complete Automated Test Suite
      run: |
        pytest tests/ -v
